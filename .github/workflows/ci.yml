name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build Xcode project
        run: xcodebuild -project Espresso.xcodeproj -scheme Espresso -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
