name: Espresso
options:
  bundleIdPrefix: dev.espresso
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  EspressoCore:
    type: library.static
    platform: macOS
    sources: [Sources/EspressoCore]
  Espresso:
    type: application
    platform: macOS
    sources:
      - path: Sources/Espresso
      - path: Assets/AppIcon.icns
    dependencies:
      - target: EspressoCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Espresso
        CFBundleDisplayName: Espresso
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 ergonomicdev. Released under the MIT License."
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.espresso.Espresso
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  EspressoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/EspressoCoreTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EspressoCore
schemes:
  Espresso:
    build:
      targets:
        Espresso: all
    run:
      config: Debug
    test:
      targets: [EspressoCoreTests]
